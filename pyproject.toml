[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-lab"
version = "0.1.0"
description = "Laboratorio 1 PSI (13318) - Muestreo, Filtrado e Imagenes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grupo PSI", email = "contacto@usach.cl" }]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]